name: Build
description: Build and push a Docker image to ghcr.io

inputs:
  registry:
    description: The Container registry to push the image to
    required: false
    default: ghcr.io
  registry_username:
    description: The Container registry username
    required: false
    default: ${{ github.actor }}
  registry_password:
    description: The Container registry password
    required: false
    default: ${{ github.token }}
  image_name:
    description: The name of the Docker image
    required: false
    default: ${{ github.repository }}
  dockerfile:
    description: The path to the Dockerfile
    required: false
    default: ./Dockerfile
  platforms:
    description: List of target platforms for build
    required: false
    default: linux/arm64

runs:
  using: composite
  steps:
    - name: Extract metadata for the Docker image
      id: meta
      uses: docker/metadata-action@v5
      env:
        DOCKER_METADATA_PR_HEAD_SHA: ${{ github.event_name == 'pull_request' }}
      with:
        images: ${{ inputs.registry }}/${{ inputs.image_name }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}},enable={{is_default_branch}}
          type=sha,priority=1000,prefix=,suffix=,format=long
          type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Build (artifact export)
      uses: docker/build-push-action@v6
      with:
        push: false
        context: .
        file: ${{ inputs.dockerfile }}
        outputs: type=local,dest=./output
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Detect if output directory has /out
      id: detect_out
      shell: bash
      run: |
        if [ -d "output/out" ] && [ "$(ls -A output/out)" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload ./output/out (if present)
      if: ${{ steps.detect_out.outputs.present == 'true' }}
      uses: actions/upload-artifact@v5
      with:
        name: out
        path: output/out
        if-no-files-found: ignore

    - name: Build and push
      if: ${{ steps.detect_out.outputs.present == 'false' }}
      id: push
      uses: docker/build-push-action@v6
      with:
        push: true
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      if: ${{ inputs.push && github.event_name != 'pull_request' && steps.detect_out.outputs.present == 'false' }}
      uses: actions/attest-build-provenance@v3
      with:
        subject-name: ${{ inputs.registry }}/${{ inputs.image_name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
